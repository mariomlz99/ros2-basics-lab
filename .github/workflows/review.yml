name: Lab release validation
on:
  push:
    branches: [main, audit/kinenest-findings-2027]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Source and shipped-asset regression checks
        run: |
          node --test --experimental-test-isolation=none tests/*.test.mjs
          LAB_SOURCE_ROOT="assets/$(node -p "require('./build-info.json').assetVersion")/src" node --test --experimental-test-isolation=none tests/*.test.mjs
          node scripts/verify-distribution.mjs
      - name: Install isolated browser test tools
        run: |
          npm install --prefix "$RUNNER_TEMP/lab-browser-tools" --no-audit --no-fund playwright-core@1.63.0
          node "$RUNNER_TEMP/lab-browser-tools/node_modules/playwright-core/cli.js" install --with-deps chromium firefox
          echo "PLAYWRIGHT_MODULE=$RUNNER_TEMP/lab-browser-tools/node_modules/playwright-core/index.mjs" >> "$GITHUB_ENV"
      - name: Chrome and Firefox candidate, desktop and phone widths
        run: node scripts/browser-review.mjs
      - name: Verify live Pages after publication
        if: github.ref == 'refs/heads/main'
        env:
          LAB_URL: https://mariomlz99.github.io/ros2-basics-lab/
          QA_OUTPUT: artifacts/live-review
        run: node scripts/browser-review.mjs
      - name: Retain browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lab-browser-evidence
          path: artifacts/
          retention-days: 7
